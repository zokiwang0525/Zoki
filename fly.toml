# Fly.io 設定（app 名稱需全球唯一,fly launch 會幫你確認/修改）
app = "ickombat-server"
primary_region = "sin"   # 新加坡,離台灣近

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
